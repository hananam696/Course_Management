<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{title}} | Student Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">Student Portal</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/request">Dashboard</a>
        <a class="nav-link" href="/student/requests">My Requests</a>
        <a class="nav-link active" href="/student/cancel">Cancelled Requests</a>
        <a class="nav-link" href="/student/request/new">New Request</a>
        <a class="nav-link" href="/auth/logout">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4" style="width: 83%; margin-left: 130px;" >
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h4>Dashboard</h4>
        <a href="/student/request/new" class="btn btn-primary">+ New Request</a>
      </div>
      <div class="card-body">
        <div class="request">
          <form method="post">
              <fieldset class="firstfield">
            <label for="fullname">Full Name: *</label>
            <br>
            <input type="text" class="form-control w-50" id="fullname" name="fullname">
            <br></br>
            <label for="email">Email: *</label>
            <br>
            <input type="email" class="form-control w-50" id="email" name="email">
            <br></br>
            <div class="col-md-6">
              <label for="semester">Select Semester *</label>
              <br>
              <select class="form-control" name="semester" style="width: 100%;">
                <option value="Winter-2025">Winter 2025</option>
                <option value="Spring-2025">Spring 2025</option>
                <option value="Fall-2025">Fall 2025</option>
              </select>
              <br>
            </div>
            <br>
            <div class="col-md-7">
              <label class="form-label">Request Category *</label>
              <br>
              <select class="form-control" name="category" style="width: 86%">  <!-- Fixed width -->
                <option value="Scholarship">Apply for Scholarship</option>
                <option value="Graduation">Apply for Graduation</option>
                <option value="Employment">Apply for Student Employment</option>
                <option value="Registration">Registration and Enrollment Letter</option>
                <option value="Fees">Fees Letter</option>
                <option value="Transcript">Unofficial Transcript</option>
                <option value="Capstone">Capstone Enrollment</option>
                <option value="New Sections">Open new sections</option>
                <option value="other">Other</option>
              </select>
              <br>
            </div>
            <br>
            <div class="mb-3">
              <label class="form-label">Description: </label>
              <br>
              <textarea class="form-control w-50" name="description"></textarea>
            </div>
            <br>

             <!-- Submit Button -->
             <div class="mb-3">
              <button type="submit" class="btn btn-primary">Submit Request</button>
            </div>
          </fieldset>
        </form>
      </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
