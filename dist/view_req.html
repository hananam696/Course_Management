<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Requests | Student Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navigation (same as your other pages) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">Student Portal</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/request">Dashboard</a>
        <a class="nav-link active" href="/student/requests">My Requests</a>
        <a class="nav-link" href="/student/request/new">New Request</a>
        <a class="nav-link" href="/auth/logout">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card">
      <div class="card-header">
        <h4>My Requests</h4>
      </div>
      <div class="card-body">
        <div class="col-md-6 mb-4">
          <form action="/student/requests" method="GET">
            <label class="form-label">Select Semester *</label>
            <br>
            <select class="form-control" id="semester" name="semester">
              <option value="all-2025">All Semesters - Year 2025</option>
              <option value="Winter-2025">Winter 2025</option>
              <option value="Spring-2025">Spring 2025</option>
              <option value="Fall-2025">Fall 2025</option>
            </select>
            <button type="submit" style="background-color: #007BFF; color: white; border: none; padding: 6px 12px; border-radius: 4px; display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; margin-top: 10px;">
              <span>Filter</span>
              <svg xmlns="http://www.w3.org/2000/svg" height="16" width="16" fill="white" viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2Zm-7-6h18v-2H3v2Zm3-6v2h12V6H6Z"/></svg>
            </button>
          </form>
        </div>
        <div class="table-responsive">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>S.No.</th>
                <th>Category</th>
                <th>Status</th>
                <th>Created At</th>
                <th>Estimated Process Time</th>
                <th>Cancel Request</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {{#each userRequests}}
              <tr>
                <td>{{@index}}</td>
                <td>{{this.category}}</td>
                <td><span class="badge bg-warning">Pending</span></td>
                <td>{{this.createdAt}}</td>
                <td></td> <!-- Leave Estimated Time empty -->
                <td><button type="cancel" class="btn btn-primary" style="background-color: red;">Cancel Request</button></td>
                <td><button type="view" class="btn btn-primary">View Details</button></td>
              </tr>
              {{/each}}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
