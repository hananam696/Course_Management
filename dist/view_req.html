<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Requests | Student Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navigation (same as your other pages) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">Student Portal</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/request">Dashboard</a>
        <a class="nav-link active" href="/student/requests">My Requests</a>
        <a class="nav-link" href="/student/request/new">New Request</a>
        <a class="nav-link" href="/student/profile">Profile</a>
        <a class="nav-link" href="/auth/logout">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card">
      <div class="card-header">
        <h4>My Requests</h4>
      </div>
      <div class="card-body">
        <div class="col-md-6">
            <label class="form-label">Select Semester *</label>
            <br>
            <select class="form-control" name="semester" style="width: 100%;">
              <option value="spring-2024">Winter 2025</option>
              <option value="fall-2023">Spring 2025</option>
              <option value="fall-2023">Fal 2025</option>
            </select>
            <br>
          </div>
          <br>
        <div class="table-responsive">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>S.No.</th>
                <th>Category</th>
                <th>Status</th>
                <th>Created At</th>
                <th>Estimated Process Time</th>
                <th>Cancel Requeest</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {{#each requests}}
              <tr>
                <td>{{this.id}}</td>
                <td>{{this.category}}</td>
                <td>{{this.status}}</td>
                <td>{{this.createdAt}}</td>
                <td></td>
                <td><button type="cancel" class="btn btn-primary" style="background-color: red;">Cancel Request</button></td>
                <td><button type="view" class="btn btn-primary">View Details</button></td>
                  <span class="badge
                    {{#eq this.status 'Pending'}}bg-warning{{/eq}}
                    {{#eq this.status 'Approved'}}bg-success{{/eq}}
                    {{#eq this.status 'Rejected'}}bg-danger{{/eq}}">
                    {{this.status}}
                  </span>
                </td>
              </tr>
              {{/each}}
            </tbody>
          </table>
        </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
